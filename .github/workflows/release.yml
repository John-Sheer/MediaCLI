name: Release MediaCLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" || true

      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Android app
        run: |
          npm run build
          npx tauri android build --target aarch64
          # Sur Linux, tauri cree deja le symlink du .so dans jniLibs - copie seulement si absent
          LIB_SRC=src-tauri/target/aarch64-linux-android/release/libmedia_cli_lib.so
          LIB_DST=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libmedia_cli_lib.so
          if [ ! -e "$LIB_DST" ]; then
            mkdir -p "$(dirname "$LIB_DST")"
            cp "$LIB_SRC" "$LIB_DST"
          fi

      - name: Sign APK (si keystore configure)
        if: secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$ZIPALIGN" -f 4 "$APK" aligned.apk
          "$APKSIGNER" sign --ks keystore.jks --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out MediaCLI.apk aligned.apk

      - name: Check APK output
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print
          ls -la MediaCLI.apk 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediacli-android-apk
          path: |
            MediaCLI.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            MediaCLI.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
