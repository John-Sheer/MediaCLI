name: Release MediaCLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" || true

      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Android app
        run: |
          npm run build
          npx tauri android build --target aarch64
          # Sur Linux, tauri cree deja le symlink du .so dans jniLibs - copie seulement si absent
          LIB_SRC=src-tauri/target/aarch64-linux-android/release/libmedia_cli_lib.so
          LIB_DST=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libmedia_cli_lib.so
          if [ ! -e "$LIB_DST" ]; then
            mkdir -p "$(dirname "$LIB_DST")"
            cp "$LIB_SRC" "$LIB_DST"
          fi

      - name: Sign APK (si keystore configure)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Keystore secrets non configures - APK non signe"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$ZIPALIGN" -f 4 "$APK" aligned.apk
          "$APKSIGNER" sign --ks keystore.jks --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out MediaCLI.apk aligned.apk

      - name: Check APK output
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print
          ls -la MediaCLI.apk 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediacli-android-apk
          path: |
            MediaCLI.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            MediaCLI.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Installer la clé de signature minisign
        shell: pwsh
        env:
          KEYFILE: ${{ secrets.TAURI_KEYFILE }}
          KEYPASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.tauri" | Out-Null
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.tauri\mediacli.key", $env:KEYFILE)
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.tauri\mediacli.key.pass", $env:KEYPASS)

      # ATTENTION: les ressources (ffmpeg.exe, yt-dlp.exe, tor.exe) sont des
      # placeholders de 0 octet dans le repo. Ajuster cette étape pour
      # télécharger les vrais binaires avant le build, sinon l'installeur
      # Windows sera livré sans outils de streaming/téléchargement.
      - name: Vérifier les ressources
        shell: pwsh
        run: |
          Get-ChildItem src-tauri\resources\*.exe | ForEach-Object {
            if ($_.Length -eq 0) { Write-Warning "Ressource vide: $($_.Name) (0 octet)" }
          }

      - name: Build Windows app (NSIS signé)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_KEYFILE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run build
          npx tauri build --bundles nsis

      - name: Générer latest.json + renommer l'installeur
        id: manifest
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installeur NSIS introuvable" }
          Copy-Item $setup.FullName "MediaCLI-Setup.exe"
          if (Test-Path "$($setup.FullName).sig") { Copy-Item "$($setup.FullName).sig" "MediaCLI-Setup.exe.sig" }
          $sigText = if (Test-Path "$($setup.FullName).sig") { (Get-Content -Raw "$($setup.FullName).sig").Trim() } else { "" }
          $sigField = if ($sigText) { [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($sigText)) } else { "" }
          $version = (Get-Content -Raw "src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          $tag = "v$version"
          $releaseBase = "https://github.com/John-Sheer/MediaCLI/releases/download/$tag"
          $json = @{
            version = $version
            notes   = "Mises à jour depuis l'application (Windows + Android), stabilité et correctifs."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "android-arm64"  = @{ url = "$releaseBase/MediaCLI.apk"; signature = "" }
              "windows-x86_64" = @{ url = "$releaseBase/MediaCLI-Setup.exe"; signature = $sigField }
            }
          }
          ($json | ConvertTo-Json -Depth 6) | Set-Content -Encoding UTF8 "latest.json"
          echo "TAG=$tag" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Upload Windows assets to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            MediaCLI-Setup.exe
            MediaCLI-Setup.exe.sig
            latest.json
