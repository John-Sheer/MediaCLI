[package]
name = "media-cli"
version = "0.1.9"
description = "MédiaCLI — Application de musique via YouTube"
edition = "2021"

[lib]
name = "media_cli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "media-cli"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time", "net"] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
jni = "0.21"
regex = "1"
base64 = "0.22"
mime_guess = "2"
async-stream = "0.3"
url = "2"
urlencoding = "2"
futures-core = "0.3"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
